name: SynergySync
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  SynergySync:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Synergy Sync"
        NSCalendarsUsageDescription: "School Timetable needs calendar access to refresh your school lessons."
        NSCalendarsFullAccessUsageDescription: "School Timetable needs access to create and refresh lessons in its dedicated calendar."
        NSCalendarsWriteOnlyAccessUsageDescription: "School Timetable needs permission to add lessons to your calendar."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SynergySync
        PRODUCT_NAME: SynergySync
        SWIFT_VERSION: "5.9"
